pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            url = "./plugins"
        }
    }
}
plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}
rootProject.name = 'UltraCosmetics'
include 'v1_21_R3', 'core', 'java-21', 'legacy-events', 'nms', 'paper-support'
